name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Flutter project structure
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name not_hesaplama --platforms android .
          cp /tmp/main.dart lib/main.dart
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK (Split Per ABI for lowest size)
        run: flutter build apk --release --split-per-abi
        
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
