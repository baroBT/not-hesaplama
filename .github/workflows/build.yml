name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Flutter project structure
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name not_hesaplama --platforms android .
          cp /tmp/main.dart lib/main.dart
          
      - name: Change App Name
        run: |
          sed -i 's/android:label="not_hesaplama"/android:label="Notlarını Hesapla"/g' android/app/src/main/AndroidManifest.xml
          
      - name: Get dependencies
        run: flutter pub get

      - name: Install Launcher Icons
        run: |
          flutter pub add --dev flutter_launcher_icons
          printf 'flutter_launcher_icons:\n  android: "launcher_icon"\n  image_path: "logo.png"\n' > flutter_launcher_icons.yaml
          flutter pub run flutter_launcher_icons
        
      # SADECE 64-BIT (ARM64) İÇİN DERLEME (En düşük boyut)
      - name: Build APK (64-bit only)
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
